services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/tech_coach"
      REDIS_URL: "redis://redis:6379/0"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      ALLOWED_USER_EMAIL: "${ALLOWED_USER_EMAIL}"
      APP_SECRET_KEY: "local-dev-secret-not-for-production"
      OAUTH_REDIRECT_URI: "http://localhost:8000/api/v1/auth/callback"
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./prompts:/app/prompts:ro
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  postgres_data:
