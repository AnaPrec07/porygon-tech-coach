[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-coach"
version = "0.1.0"
description = "Production-grade AI Coaching Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.1",
    # Vertex AI / Google Cloud
    "google-cloud-aiplatform>=1.57.0",
    "google-auth>=2.29.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-trace>=1.11.0",
    "google-cloud-secret-manager>=2.20.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    # Validation & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Caching
    "redis[hiredis]>=5.0.0",
    # Async utilities
    "anyio>=4.4.0",
    "tenacity>=8.3.0",
    # Frontend
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # Observability
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    # Utilities
    "structlog>=24.2.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tech_coach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tech_coach --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
