# Cloud Build CI/CD pipeline
#
# Triggers:
#   - Push to main branch → deploy to production
#   - Push to any branch → run tests + eval gate only
#
# Steps:
#   1. Install and lint
#   2. Run unit tests
#   3. Run eval gate (blocks deployment if regression)
#   4. Build Docker image (production only)
#   5. Push to Artifact Registry
#   6. Deploy to Cloud Run (production only)
#   7. Run smoke tests

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: tech-coach-api
  _FRONTEND_SERVICE_NAME: tech-coach-frontend
  _ARTIFACT_REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/tech-coach
  _EVAL_THRESHOLD: "0.85"
  _EVAL_PROMPT_NAME: coaching_dialogue

steps:
  # -------------------------------------------------------------------------
  # Step 1: Install dependencies and run linting
  # -------------------------------------------------------------------------
  - name: "python:3.11"
    id: "install-and-lint"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]" --quiet
        ruff check src/
        mypy src/tech_coach --ignore-missing-imports
    dir: "tech_coach"

  # -------------------------------------------------------------------------
  # Step 2: Unit tests
  # -------------------------------------------------------------------------
  - name: "python:3.11"
    id: "unit-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]" --quiet
        pytest tests/unit/ -v --tb=short --cov=tech_coach --cov-report=term-missing
    dir: "tech_coach"
    waitFor: ["install-and-lint"]

  # -------------------------------------------------------------------------
  # Step 3: Evaluation gate (runs against staging Vertex AI project)
  # Only runs when BRANCH_NAME == "main" (configurable)
  # -------------------------------------------------------------------------
  - name: "python:3.11"
    id: "eval-gate"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e . --quiet
        python evals/evaluator.py \
          --prompt-name ${_EVAL_PROMPT_NAME} \
          --threshold ${_EVAL_THRESHOLD} \
          --output /workspace/eval_report.json
        echo "Eval gate passed."
    dir: "tech_coach"
    env:
      - "GCP_PROJECT_ID=${PROJECT_ID}"
      - "VERTEX_AI_LOCATION=${_REGION}"
    secretEnv:
      - "DATABASE_URL"
      - "APP_SECRET_KEY"
    waitFor: ["unit-tests"]

  # -------------------------------------------------------------------------
  # Step 4: Build backend Docker image
  # -------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "--cache-from"
      - "${_ARTIFACT_REGISTRY}/backend:latest"
      - "-t"
      - "${_ARTIFACT_REGISTRY}/backend:${SHORT_SHA}"
      - "-t"
      - "${_ARTIFACT_REGISTRY}/backend:latest"
      - "-f"
      - "tech_coach/Dockerfile"
      - "tech_coach"
    waitFor: ["eval-gate"]

  # -------------------------------------------------------------------------
  # Step 5: Build frontend Docker image
  # -------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "${_ARTIFACT_REGISTRY}/frontend:${SHORT_SHA}"
      - "-t"
      - "${_ARTIFACT_REGISTRY}/frontend:latest"
      - "-f"
      - "tech_coach/Dockerfile.frontend"
      - "tech_coach"
    waitFor: ["eval-gate"]

  # -------------------------------------------------------------------------
  # Step 6: Push images
  # -------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/backend"]
    waitFor: ["build-backend"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/frontend"]
    waitFor: ["build-frontend"]

  # -------------------------------------------------------------------------
  # Step 7: Deploy backend to Cloud Run
  # -------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_ARTIFACT_REGISTRY}/backend:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=tech-coach@${PROJECT_ID}.iam.gserviceaccount.com"
      - "--set-secrets=DATABASE_URL=tech-coach-db-url:latest,APP_SECRET_KEY=tech-coach-secret-key:latest,GOOGLE_CLIENT_ID=tech-coach-google-client-id:latest,GOOGLE_CLIENT_SECRET=tech-coach-google-client-secret:latest,ALLOWED_USER_EMAIL=tech-coach-allowed-email:latest"
      - "--set-env-vars=APP_ENV=production,GCP_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=${_REGION}"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--max-instances=3"
      - "--concurrency=80"
    waitFor: ["push-backend"]

  # -------------------------------------------------------------------------
  # Step 8: Deploy frontend to Cloud Run
  # -------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SERVICE_NAME}"
      - "--image=${_ARTIFACT_REGISTRY}/frontend:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=BACKEND_URL=https://${_SERVICE_NAME}-${_REGION}.run.app"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--max-instances=2"
    waitFor: ["push-frontend"]

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/tech-coach-db-url/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/tech-coach-secret-key/versions/latest
      env: APP_SECRET_KEY

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: "1800s"
